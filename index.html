<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>กิจกรรม Identity V (กรอกรหัส)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#121214;--sf:#1c1c20;--sf2:#26262c;--ln:#38383f;--tx:#ece8e1;--mu:#9a9aa3;--ac:#b8324c;--ac2:#d8506a;--ok:#4caf7d;--wn:#d9a441;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "Noto Sans Thai",system-ui,sans-serif}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--ln);background:var(--sf)}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 60px}
.warn{background:#2a1a1e;border:1px solid var(--ac);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:16px}
h1{font-size:28px;line-height:1.25;margin:8px 0}h2{font-size:20px;margin:20px 0 8px}p{margin:6px 0}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:10px 0}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:15px}
input,select{width:100%;min-height:48px;padding:10px 12px;background:var(--sf2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac2);outline-offset:1px}
button{min-height:48px;padding:10px 18px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}
button.g{background:var(--sf2);color:var(--tx);border:1px solid var(--ln)}
button.s{min-height:38px;padding:6px 12px;font-size:14px}
button.d{background:#5a1f2a}
.full{width:100%;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.tabs button{flex:0 0 auto;min-height:40px;background:var(--sf2);color:var(--mu);border:1px solid var(--ln)}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid var(--ln)}
.t-pending{color:var(--wn);border-color:var(--wn)}.t-review,.t-used{color:#6fb1e8;border-color:#6fb1e8}.t-sent,.t-unused{color:var(--ok);border-color:var(--ok)}.t-cancelled,.t-expired{color:var(--mu)}
.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.5px}
.err{color:#ff8a9b;margin-top:8px;font-size:15px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:15px}.kv b{color:var(--mu);font-weight:400}
dialog{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:14px;max-width:420px;width:calc(100% - 28px)}
dialog::backdrop{background:#000a}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sf2);border:1px solid var(--ac);padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90%}
</style>
</head>
<body>
<div class="top"><button class="g s" id="adm" onclick="goAdmin()">Admin</button><span class="mu">เว็บไซต์แฟนสร้างเอง</span></div>
<div class="wrap" id="app"><p class="mu">กำลังโหลด...</p></div>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,collection,query,orderBy,limit,writeBatch,Timestamp,serverTimestamp,arrayUnion} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAbFT5shgG4A-7Mbt22EYVDstrfqkJXwOA",authDomain:"idv-event.firebaseapp.com",projectId:"idv-event",storageBucket:"idv-event.firebasestorage.app",messagingSenderId:"578921851701",appId:"1:578921851701:web:6669eeebfca88ec0443a7c"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ms=t=>t&&t.toMillis?t.toMillis():(t||Date.now());
const fd=t=>new Date(ms(t)).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
const fdt=t=>new Date(ms(t)).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});
const eod=d=>Timestamp.fromDate(new Date(d+'T23:59:59'));
const SL={pending:'รอตรวจสอบ',review:'กำลังตรวจสอบ',sent:'ส่งรางวัลแล้ว',cancelled:'ยกเลิกรายการ'};
const CL_={unused:'ยังไม่ใช้',used:'ใช้แล้ว',expired:'หมดอายุ',cancelled:'ยกเลิก'};
const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',rnd=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>A[b%A.length]).join('');
const genCode=()=>`IDV-${rnd(4)}-${rnd(4)}`;
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,20);
const dd=d=>({id:d.id,...d.data()});
let me=null,tab='events',pv={step:'code'},q='',siteOpen=true,EV=[],CD=[],CLM=[],LG=[],AD=[];
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3000)}
function closeD(){$('#dlg').close()}
function ask(title,body,ok,label='ยืนยัน'){const d=$('#dlg');d.innerHTML=`<h2 style="margin-top:0">${title}</h2>${body}<div class="row" style="margin-top:14px"><button class="g" onclick="closeD()">ยกเลิก</button><button id="okb">${label}</button></div>`;$('#okb').onclick=async()=>{const b=$('#okb');b.disabled=true;try{if(await ok()!==false)d.close()}catch(e){toast('ทำรายการไม่สำเร็จ');}b.disabled=false};d.showModal()}
async function log(a){try{await addDoc(collection(db,'logs'),{t:serverTimestamp(),by:me?me.name:'?',a})}catch(e){}}
const cstat=c=>c.status==='unused'&&ms(c.exp)<Date.now()?'expired':c.status;
const evOpen=e=>e.open&&ms(e.endAt)>Date.now();
const WARN='<div class="warn">เว็บไซต์นี้ไม่ใช่เว็บไซต์อย่างเป็นทางการของ Identity V และไม่มีความเกี่ยวข้องกับผู้พัฒนาเกมหรือผู้ให้บริการเกมอย่างเป็นทางการ</div>';
const lk=()=>{try{return JSON.parse(localStorage.getItem('idvf'))||{n:0,until:0}}catch(e){return{n:0,until:0}}};
const sk=v=>{try{localStorage.setItem('idvf',JSON.stringify(v))}catch(e){}};
function go(s){pv={step:s};render()}
function setTab(k){tab=k;q='';render()}
function goAdmin(){if(me){signOut(auth);return}pv={step:'login'};render()}

onAuthStateChanged(auth,async u=>{
 if(!u){me=null;render();return}
 try{const s=await getDoc(doc(db,'admins',u.uid));
  if(s.exists()&&[true,'true'].includes(s.data().active)){me={uid:u.uid,...s.data()};tab='events';
   const st=await getDoc(doc(db,'meta','site'));if(!st.exists())await setDoc(doc(db,'meta','site'),{open:true});else siteOpen=st.data().open!==false}
  else{pv={step:'login',err:'บัญชีนี้ยังไม่ได้รับสิทธิ์แอดมิน (ไม่พบเอกสาร admins ของ UID '+u.uid+')'};await signOut(auth);render();return}}
 catch(e){pv={step:'login',err:'เข้าสู่ระบบไม่สำเร็จ: '+(e.code||e.message)};await signOut(auth);render();return}
 render()});
(async()=>{try{const s=await getDoc(doc(db,'meta','site'));siteOpen=!s.exists()||s.data().open!==false}catch(e){}if(!me)render()})();

async function render(){
 $('#adm').textContent=me?'ออกจากระบบ':'Admin';
 if(!me){$('#app').innerHTML=pv.step==='login'?loginView():playerView();return}
 $('#app').innerHTML='<p class="mu">กำลังโหลด...</p>';
 try{
  if(tab==='events'||tab==='codes')EV=(await getDocs(collection(db,'events'))).docs.map(dd);
  if(tab==='codes')CD=(await getDocs(query(collection(db,'codes'),orderBy('created','desc'),limit(300)))).docs.map(dd);
  if(tab==='claims')CLM=(await getDocs(query(collection(db,'claims'),orderBy('created','desc'),limit(300)))).docs.map(dd);
  if(tab==='log')LG=(await getDocs(query(collection(db,'logs'),orderBy('t','desc'),limit(200)))).docs.map(dd);
  if(tab==='team')AD=(await getDocs(collection(db,'admins'))).docs.map(dd);
 }catch(e){$('#app').innerHTML='<div class="err">โหลดข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง</div>';return}
 $('#app').innerHTML=adminView();if($('#ce'))fillRw()}
/* ---------- Player ---------- */
const SV={asia:'เซิร์ฟเวอร์เอเชีย',naeu:'เซิร์ฟเวอร์อเมริกาเหนือ/ยุโรป'};
const HOURS='<div class="card"><b>เวลาทำการของแอดมิน (เวลาไทย)</b><p class="mu">ประมาณ 12:10–12:50 น. และตั้งแต่ 20:00 น. เป็นต้นไป ไม่ต้องเช็กบ่อย รอถึงช่วงเวลานี้แล้วค่อยตรวจสอบสถานะ</p></div>';
const HINT={pending:'รอแอดมินตรวจสอบ',review:'แอดมินกำลังตรวจสอบและดำเนินการส่งรางวัล',sent:'แอดมินส่งรางวัลเรียบร้อยแล้ว',cancelled:'รายการนี้ถูกยกเลิก ติดต่อผู้จัดกิจกรรมหากมีข้อสงสัย'};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function expText(t){const e=new Date(ms(t)),a=new Date(),n=Math.round((new Date(e.getFullYear(),e.getMonth(),e.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);return n<=0?'หมดอายุวันนี้ (สิ้นสุด 23:59 น.)':`อีก ${n} วัน (หมดอายุวันที่ ${fd(t)})`}
const lastClaim=()=>{try{return JSON.parse(localStorage.getItem('idvlast'))||{}}catch(e){return{}}};
function copyId(t){const bad=()=>toast('คัดลอกไม่ได้ ให้กดค้างที่หมายเลขเพื่อคัดลอก');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('คัดลอกแล้ว: '+t),bad);else bad()}
window.copyId=copyId;
function playerView(){
 if(!siteOpen)return WARN+'<h1>ไม่พบหน้าที่ต้องการ</h1>';
 const s=pv.step;
 if(s==='code')return WARN+`<h1>กิจกรรม Identity V</h1><p class="mu">กรอกรหัสกิจกรรมเพื่อรับรางวัลของคุณ</p>
 <label for="cd">รหัสกิจกรรม (Event Code)</label><input id="cd" class="code" autocomplete="off" autocapitalize="characters" placeholder="กรอกโค้ดของคุณที่นี่...">
 <div class="err" id="er"></div><button class="full" id="cb" onclick="chk()">ตรวจสอบโค้ด</button>
 <button class="full g" onclick="go('look')">ตรวจสอบรายการของฉัน</button>`;
 if(s==='form'){const c=pv.code;return WARN+`<h1>${esc(c.eventName)}</h1><p>${esc(pv.desc)}</p>
 <div class="card"><div class="kv"><b>รางวัลที่จะได้รับ</b><span>${esc(c.reward)}</span><b>โค้ด</b><span class="code">${esc(c.id)}</span><b>อายุโค้ด</b><span>${expText(c.exp)}</span></div></div>
 <label for="sv">เซิร์ฟเวอร์ที่เล่น *</label><select id="sv"><option value="">เลือกเซิร์ฟเวอร์</option><option value="asia">${SV.asia}</option><option value="naeu">${SV.naeu}</option></select>
 <label for="uid">UID ในเกม *</label><input id="uid" inputmode="numeric" maxlength="30">
 <label for="nm">ชื่อในเกม *</label><input id="nm" maxlength="60">
 <div class="err" id="er"></div><button class="full" onclick="review()">ตรวจสอบข้อมูลก่อนส่ง</button>
 <button class="full g" onclick="go('code')">กลับ</button>`}
 if(s==='done')return WARN+`<h1>ส่งข้อมูลสำเร็จ</h1>
 <div class="card"><p class="mu">หมายเลขรายการรับรางวัลของคุณ ต้องใช้หมายเลขนี้คู่กับ UID ในเกม จึงจะตรวจสอบสถานะได้</p><p class="code" style="font-size:26px;font-weight:800;user-select:all">${esc(pv.claim.id)}</p><button class="full" onclick="copyId('${esc(pv.claim.id)}')">คัดลอกหมายเลขรายการ</button><p class="mu">เบราว์เซอร์นี้จะจำหมายเลขไว้ในหน้า "ตรวจสอบรายการของฉัน" แต่ควรคัดลอกหรือจดเก็บไว้ด้วย</p></div>`+claimCard(pv.claim,false)+HOURS+`<p class="mu">ผู้เล่นแก้ไขข้อมูลเองไม่ได้ หากกรอกผิดให้ติดต่อผู้จัดกิจกรรม</p><button class="full" onclick="go('code')">กลับหน้าแรก</button>`;
 if(s==='look'){const l=lastClaim();return WARN+`<h1>ตรวจสอบรายการ</h1><div class="card"><b>ต้องใช้อะไรตรวจสอบ</b><p class="mu">ต้องใช้ "หมายเลขรายการรับรางวัล" (CLAIM-xxxxxx ที่ได้หลังส่งข้อมูลสำเร็จ) คู่กับ UID ในเกม ใช้แค่โค้ดที่กรอกตรวจสอบไม่ได้</p></div>`+HOURS+`<label for="cn">หมายเลขรายการรับรางวัล</label><input id="cn" class="code" placeholder="CLAIM-XXXXXX" value="${esc(l.id||'')}"><label for="lu">UID ในเกม</label><input id="lu" inputmode="numeric" value="${esc(l.uid||'')}">
 <div class="err" id="er"></div><button class="full" onclick="lookup()">ตรวจสอบ</button><button class="full g" onclick="go('code')">กลับ</button>`}
 if(s==='found')return WARN+'<h1>รายการของคุณ</h1>'+claimCard(pv.claim,false)+`<p><b>${HINT[pv.claim.status]||''}</b></p>`+HOURS+'<button class="full g" onclick="go(\'code\')">กลับหน้าแรก</button>';
}
function claimCard(c,adm){return `<div class="card"><div class="kv"><b>หมายเลขรายการ</b><span class="code">${esc(c.id||c.claimId)}</span><b>กิจกรรม</b><span>${esc(c.eventName)}</span><b>รางวัล</b><span>${esc(c.reward)}</span><b>โค้ดที่ใช้</b><span class="code">${esc(c.code)}</span><b>เซิร์ฟเวอร์</b><span>${esc(SV[c.server]||'-')}</span><b>UID</b><span>${esc(c.uid)}</span><b>ชื่อในเกม</b><span>${esc(c.name)}</span><b>วันที่ส่งข้อมูล</b><span>${fd(c.created)}</span><b>สถานะ</b><span><span class="tag t-${c.status}">${SL[c.status]}</span></span></div></div>`}
async function chk(){
 const er=$('#er'),L=lk();if(L.until>Date.now()){er.textContent=`ลองผิดหลายครั้งเกินไป กรุณารออีก ${Math.ceil((L.until-Date.now())/60000)} นาที`;return}
 const v=$('#cd').value.trim().toUpperCase().replace(/[^A-Z0-9-]/g,'');
 $('#cb').disabled=true;let ok=false,c,desc='';
 try{if(v){const s=await getDoc(doc(db,'codes',v));
  if(s.exists()){c=dd(s);if(cstat(c)==='unused'){const e=await getDoc(doc(db,'events',c.eventId));if(e.exists()&&evOpen(e.data())){ok=true;desc=e.data().desc||''}}}}}
 catch(e){er.textContent='เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง';$('#cb').disabled=false;return}
 if(!ok){L.n++;if(L.n>=5){sk({n:0,until:Date.now()+15*60000});er.textContent='กรอกผิด 5 ครั้ง ระงับการลอง 15 นาที'}else{sk(L);er.textContent='โค้ดไม่ถูกต้องหรือใช้งานไม่ได้'}$('#cb').disabled=false;return}
 sk({n:0,until:0});pv={step:'form',code:c,desc};render()}
function review(){
 const sv=$('#sv').value,uid=$('#uid').value.trim(),nm=$('#nm').value.trim(),er=$('#er');
 if(!sv||!uid||!nm){er.textContent='กรุณาเลือกเซิร์ฟเวอร์ และกรอก UID กับชื่อในเกมให้ครบ';return}
 ask('คุณแน่ใจในข้อมูลแล้วใช่ไหม?',`<div class="kv"><b>เซิร์ฟเวอร์</b><span>${esc(SV[sv])}</span><b>UID</b><span>${esc(uid)}</span><b>ชื่อในเกม</b><span>${esc(nm)}</span></div><p class="mu">ส่งแล้วแก้ไขเองไม่ได้ หากผิดต้องติดต่อผู้จัดกิจกรรม</p>`,()=>submit({server:sv,uid,name:nm,date:today()}),'ใช่ ส่งข้อมูล')}
async function submit(f){
 const c=pv.code,id='CLAIM-'+rnd(6),rid=id+'_'+await sha(f.uid);
 const base={code:c.id,eventId:c.eventId,eventName:c.eventName,reward:c.reward,server:f.server,uid:f.uid,name:f.name,date:f.date,status:'pending'};
 try{const b=writeBatch(db);
  b.update(doc(db,'codes',c.id),{status:'used',claimId:id});
  b.set(doc(db,'claims',id),{...base,rid,created:serverTimestamp()});
  b.set(doc(db,'receipts',rid),{claimId:id,eventName:c.eventName,reward:c.reward,code:c.id,server:f.server,uid:f.uid,name:f.name,created:serverTimestamp(),status:'pending'});
  await b.commit()}
 catch(e){toast('ส่งไม่สำเร็จ โค้ดอาจถูกใช้ไปแล้ว หรือกิจกรรมปิดรับ');go('code');return false}
 try{localStorage.setItem('idvlast',JSON.stringify({id,uid:f.uid}))}catch(e){}
 pv={step:'done',claim:{...base,id,created:Date.now()}};render()}
async function lookup(){
 const id=$('#cn').value.trim().toUpperCase(),u=$('#lu').value.trim();let r=null;
 try{if(id&&u){const s=await getDoc(doc(db,'receipts',id+'_'+await sha(u)));if(s.exists())r=s.data()}}catch(e){}
 if(!r){$('#er').textContent='ไม่พบข้อมูลหรือไม่สามารถตรวจสอบได้';return}
 pv={step:'found',claim:{...r,id:r.claimId}};render()}

/* ---------- Admin ---------- */
function loginView(){return `<h1>เข้าสู่ระบบแอดมิน</h1><label for="le">อีเมล</label><input id="le" type="email" autocomplete="username"><label for="lp">รหัสผ่าน</label><input id="lp" type="password" autocomplete="current-password">
 <div class="err" id="er">${esc(pv.err||'')}</div><button class="full" id="lb" onclick="login()">เข้าสู่ระบบ</button><button class="full g" onclick="go('code')">กลับหน้าผู้เล่น</button>`}
async function login(){
 const e=$('#le').value.trim(),p=$('#lp').value;if(!e||!p){$('#er').textContent='กรอกอีเมลและรหัสผ่าน';return}
 $('#lb').disabled=true;try{await signInWithEmailAndPassword(auth,e,p)}catch(x){$('#er').textContent='อีเมลหรือรหัสผ่านไม่ถูกต้อง';$('#lb').disabled=false}}
function adminView(){
 const T=[['events','กิจกรรม'],['codes','โค้ด'],['claims','ผู้รับรางวัล'],['log','ประวัติ']];if(me.role==='main')T.push(['team','ทีมงาน']);
 return `<div class="row"><b>${esc(me.name)} (${me.role==='main'?'ผู้ดูแลหลัก':'ผู้จัด'})</b><button class="s ${siteOpen?'':'d'}" onclick="toggleSite()">เว็บผู้เล่น: ${siteOpen?'เปิด':'ปิด'}</button></div>
 <div class="tabs">${T.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('')}</div>`+({events:evTab,codes:cdTab,claims:clTab,log:lgTab,team:tmTab}[tab])()}
async function toggleSite(){siteOpen=!siteOpen;try{await setDoc(doc(db,'meta','site'),{open:siteOpen});log(siteOpen?'เปิดเว็บไซต์ผู้เล่น':'ปิดเว็บไซต์ผู้เล่น')}catch(e){siteOpen=!siteOpen;toast('ทำรายการไม่สำเร็จ')}render()}

function evTab(){
 return `<div class="card"><h2 style="margin-top:0">สร้างกิจกรรมใหม่</h2><label for="en">ชื่อกิจกรรม</label><input id="en"><label for="ed">รายละเอียด</label><input id="ed"><label for="ee">วันสิ้นสุด</label><input id="ee" type="date"><label for="er2">รางวัล (คั่นด้วยเครื่องหมาย , )</label><input id="er2" placeholder="กรอบโปรไฟล์, ไอเทม A"><div class="err" id="er"></div><button class="full" onclick="addEv()">สร้างกิจกรรม</button></div>`+
 (EV.map(e=>`<div class="card"><b>${esc(e.name)}</b> <span class="tag ${evOpen(e)?'t-unused':'t-expired'}">${evOpen(e)?'เปิดรับ':'ปิดรับ'}</span><p>${esc(e.desc)}</p><p class="mu">สิ้นสุด ${esc(e.end)} · รางวัล: ${e.rewards.map(esc).join(', ')}</p><div class="row"><button class="g s" onclick="togEv('${e.id}')">${e.open?'ปิดรับข้อมูล':'เปิดรับข้อมูล'}</button><button class="g s" onclick="editEv('${e.id}')">แก้ไข</button></div></div>`).join('')||'<p class="mu">ยังไม่มีกิจกรรม สร้างกิจกรรมแรกด้านบน</p>')}
async function addEv(){
 const n=$('#en').value.trim(),d=$('#ed').value.trim(),e=$('#ee').value,r=$('#er2').value.split(',').map(x=>x.trim()).filter(Boolean);
 if(!n||!e||!r.length){$('#er').textContent='ต้องมีชื่อ วันสิ้นสุด และรางวัลอย่างน้อย 1 รายการ';return}
 try{await addDoc(collection(db,'events'),{name:n,desc:d,end:e,endAt:eod(e),open:true,rewards:r});await log('สร้างกิจกรรม '+n);toast('สร้างกิจกรรมแล้ว')}catch(x){toast('บันทึกไม่สำเร็จ')}render()}
async function togEv(id){const e=EV.find(x=>x.id===id);try{await updateDoc(doc(db,'events',id),{open:!e.open});await log((e.open?'ปิดรับ ':'เปิดรับ ')+e.name)}catch(x){toast('ทำรายการไม่สำเร็จ')}render()}
function editEv(id){const e=EV.find(x=>x.id===id);
 ask('แก้ไขกิจกรรม',`<label for="x1">ชื่อ</label><input id="x1" value="${esc(e.name)}"><label for="x2">รายละเอียด</label><input id="x2" value="${esc(e.desc)}"><label for="x3">วันสิ้นสุด</label><input id="x3" type="date" value="${esc(e.end)}"><label for="x4">รางวัล</label><input id="x4" value="${esc(e.rewards.join(', '))}">`,async()=>{
 const r=$('#x4').value.split(',').map(x=>x.trim()).filter(Boolean),n=$('#x1').value.trim(),en=$('#x3').value;if(!n||!r.length||!en)return false;
 await updateDoc(doc(db,'events',id),{name:n,desc:$('#x2').value.trim(),end:en,endAt:eod(en),rewards:r});await log('แก้ไขกิจกรรม '+n);render()},'บันทึก')}
 function cdTab(){
 return `<div class="card"><h2 style="margin-top:0">สร้างโค้ด</h2>${EV.length?`<label for="ce">กิจกรรม</label><select id="ce" onchange="fillRw()">${EV.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select><label for="cr">รางวัล</label><select id="cr"></select><label for="cx">วันหมดอายุ</label><input id="cx" type="date"><label for="cm">โค้ด (พิมพ์เอง หรือกดสุ่ม)</label><div class="row"><input id="cm" class="code" style="flex:3"><button class="g" onclick="rndCode()">สุ่มโค้ด</button></div><p class="mu">โค้ดที่พิมพ์เองควรยาวและเดายาก เพราะใครรู้โค้ดก็ลองกรอกได้</p><div class="err" id="er"></div><button class="full" onclick="addCode()">บันทึกโค้ด</button>`:'<p class="mu">สร้างกิจกรรมก่อนจึงจะสร้างโค้ดได้</p>'}</div>
 <input placeholder="ค้นหาโค้ด" oninput="sq(this.value)"><div id="cl">${codeList()}</div>`}
function codeList(){return CD.filter(c=>!q||c.id.includes(q.toUpperCase())).map(c=>{const s=cstat(c);return `<div class="card"><div class="row"><span class="code" style="flex:3">${esc(c.id)}</span><span class="tag t-${s}">${CL_[s]}</span></div><p class="mu">${esc(c.eventName)} · ${esc(c.reward)} · หมดอายุ ${fd(c.exp)}${c.claimId?' · '+esc(c.claimId):''}</p>${s==='unused'?`<button class="g s" onclick="cancelCode('${c.id}')">ยกเลิกโค้ด</button>`:''}</div>`}).join('')||'<p class="mu">ยังไม่มีโค้ด</p>'}
function sq(v){q=v;if($('#cl'))$('#cl').innerHTML=codeList();if($('#cc'))$('#cc').innerHTML=claimList()}
function rndCode(){$('#cm').value=genCode()}
function fillRw(){const e=EV.find(x=>x.id===$('#ce').value);if(e)$('#cr').innerHTML=e.rewards.map(r=>`<option>${esc(r)}</option>`).join('')}
async function addCode(){
 const er=$('#er'),exp=$('#cx').value;let code=$('#cm').value.trim().toUpperCase();
 if(!exp||eod(exp).toMillis()<Date.now()){er.textContent='ต้องระบุวันหมดอายุที่ยังมาไม่ถึง';return}
 const e=EV.find(x=>x.id===$('#ce').value);
 try{
  if(!code){for(let i=0;i<8;i++){const t=genCode();if(!(await getDoc(doc(db,'codes',t))).exists()){code=t;break}}if(!code){er.textContent='สุ่มโค้ดไม่สำเร็จ ลองใหม่';return}}
  else if(!/^[A-Z0-9-]{4,30}$/.test(code)){er.textContent='โค้ดใช้ได้เฉพาะ A-Z 0-9 และ - ยาว 4-30 ตัว';return}
  else if((await getDoc(doc(db,'codes',code))).exists()){er.textContent='โค้ดนี้เคยมีอยู่แล้ว (ทุกสถานะ) ไม่บันทึก';return}
  await setDoc(doc(db,'codes',code),{eventId:e.id,eventName:e.name,reward:$('#cr').value,exp:eod(exp),status:'unused',created:serverTimestamp()});
  await log('สร้างโค้ด '+code);toast('บันทึกโค้ด '+code)}
 catch(x){er.textContent='บันทึกไม่สำเร็จ (อาจเป็นโค้ดซ้ำ)';return}
 render()}
function cancelCode(code){ask('ยกเลิกโค้ด',`<p>ยกเลิกโค้ด <span class="code">${esc(code)}</span> ? ยกเลิกแล้วนำกลับมาใช้ไม่ได้</p>`,async()=>{await updateDoc(doc(db,'codes',code),{status:'cancelled'});await log('ยกเลิกโค้ด '+code);render()})}

function clTab(){return `<input placeholder="ค้นหาด้วยโค้ดหรือหมายเลขรายการ" oninput="sq(this.value)"><div id="cc">${claimList()}</div><p class="mu">ระบบไม่มีปุ่มดาวน์โหลดข้อมูลผู้รับรางวัล · แสดง 300 รายการล่าสุด</p>`}
function claimList(){return CLM.filter(c=>!q||c.code.includes(q.toUpperCase())||c.id.includes(q.toUpperCase())).map(c=>claimCard(c,true)+`<div class="card" style="margin-top:-6px"><div class="row">${c.status==='pending'?`<button class="s" onclick="setSt('${c.id}','review')">เริ่มตรวจสอบ</button>`:''}${c.status==='review'?`<button class="s" onclick="confirmSent('${c.id}')">ส่งรางวัลแล้ว</button>`:''}${c.status!=='sent'&&c.status!=='cancelled'?`<button class="d s" onclick="cancelClaim('${c.id}')">ยกเลิกรายการ</button>`:''}<button class="g s" onclick="delClaim('${c.id}')">ลบ</button></div><p class="mu" style="font-size:13px">${(c.hist||[]).map(h=>`${fdt(h.t)} ${esc(h.by)}: ${esc(h.a)}`).join('<br>')}</p></div>`).join('')||'<p class="mu">ยังไม่มีผู้ส่งข้อมูล</p>'}
async function setStatus(id,s,a){const c=CLM.find(x=>x.id===id),b=writeBatch(db);
 b.update(doc(db,'claims',id),{status:s,hist:arrayUnion({t:Date.now(),by:me.name,a})});b.update(doc(db,'receipts',c.rid),{status:s});await b.commit();await log(id+': '+a);render()}
const setSt=(id,s)=>setStatus(id,s,'เปลี่ยนสถานะเป็น '+SL[s]).catch(()=>toast('ทำรายการไม่สำเร็จ'));
function confirmSent(id){ask('ยืนยันส่งรางวัล',`<p>ยืนยันว่าส่งรางวัลของ ${esc(id)} เรียบร้อยแล้ว?</p>`,()=>setStatus(id,'sent','เปลี่ยนสถานะเป็น ส่งรางวัลแล้ว'))}
function cancelClaim(id){ask('ยกเลิกรายการ',`<label for="rs">เหตุผล (จำเป็น)</label><input id="rs"><p class="mu">โค้ดที่ใช้ไปแล้วจะไม่กลับมาใช้ได้</p>`,()=>{const r=$('#rs').value.trim();if(!r)return false;return setStatus(id,'cancelled','ยกเลิกรายการ: '+r)},'ยกเลิกรายการ')}
function delClaim(id){ask('ลบรายการ',`<p>ลบ ${esc(id)}? ประวัติการลบจะถูกเก็บไว้ และโค้ดยังคงเป็นใช้แล้ว</p>`,async()=>{const c=CLM.find(x=>x.id===id),b=writeBatch(db);b.delete(doc(db,'claims',id));b.delete(doc(db,'receipts',c.rid));await b.commit();await log('ลบรายการ '+id+' (โค้ด '+c.code+', UID '+c.uid+')');render()},'ลบ')}
function lgTab(){return LG.map(l=>`<div class="card mu"><b style="color:var(--tx)">${esc(l.by)}</b> · ${l.t?fdt(l.t):''}<br>${esc(l.a)}</div>`).join('')||'<p class="mu">ยังไม่มีประวัติ</p>'}

function tmTab(){
 return `<div class="card"><h2 style="margin-top:0">เพิ่มผู้จัดกิจกรรม</h2><label for="tn">ชื่อที่แสดง</label><input id="tn"><label for="tu">อีเมล</label><input id="tu" type="email"><label for="tp">รหัสผ่านเริ่มต้น (10 ตัวขึ้นไป)</label><input id="tp" type="password"><div class="err" id="er"></div><button class="full" onclick="addAdm()">สร้างบัญชี</button></div>`+
 AD.map(a=>`<div class="card row"><span style="flex:3">${esc(a.name)} · ${a.role==='main'?'ผู้ดูแลหลัก':'ผู้จัด'}</span><span class="tag ${a.active?'t-unused':'t-expired'}">${a.active?'ใช้งาน':'ปิดบัญชี'}</span>${a.role!=='main'?`<button class="g s" onclick="togAdm('${a.id}')">${a.active?'ปิดบัญชี':'เปิดบัญชี'}</button>`:''}</div>`).join('')}
async function addAdm(){const n=$('#tn').value.trim(),e=$('#tu').value.trim(),p=$('#tp').value;
 if(!n||!e||p.length<10){$('#er').textContent='ต้องมีชื่อ อีเมล และรหัสผ่านอย่างน้อย 10 ตัวอักษร';return}
 try{const a2=getAuth(initializeApp(cfg,'sec'+Date.now()));const cr=await createUserWithEmailAndPassword(a2,e,p);await signOut(a2);
  await setDoc(doc(db,'admins',cr.user.uid),{name:n,role:'org',active:true});await log('สร้างบัญชีผู้จัด '+n)}
 catch(x){$('#er').textContent='สร้างบัญชีไม่สำเร็จ (อีเมลอาจซ้ำหรือรหัสผ่านสั้นเกินไป)';return}
 render()}
async function togAdm(id){const a=AD.find(x=>x.id===id);try{await updateDoc(doc(db,'admins',id),{active:!a.active});await log((a.active?'ปิดบัญชี ':'เปิดบัญชี ')+a.name)}catch(e){toast('ทำรายการไม่สำเร็จ')}render()}

Object.assign(window,{goAdmin,go,setTab,sq,closeD,chk,review,lookup,login,toggleSite,addEv,togEv,editEv,addCode,rndCode,cancelCode,fillRw,setSt,confirmSent,cancelClaim,delClaim,addAdm,togAdm});
</script>
</body>
</html>
